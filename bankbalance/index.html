<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seba's BankBalance — Acceso Seguro</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased sm:py-8">

  <div id="app" class="max-w-md mx-auto min-h-screen sm:min-h-[844px] bg-slate-950 sm:rounded-3xl shadow-2xl flex flex-col border border-slate-800 overflow-hidden relative">

    <!-- PANTALLA DE LOGIN -->
    <div v-if="!authenticated" class="flex-1 flex flex-col justify-center items-center p-6 text-center">
      <div class="w-16 h-16 bg-slate-900 rounded-2xl border border-slate-800 flex items-center justify-center text-2xl mb-4 shadow-lg">
        🔒
      </div>
      <h1 class="text-xl font-bold text-white mb-1">Seba's BankBalance</h1>
      <p class="text-xs text-slate-400 mb-6">Ingresa tu PIN o usa tu huella</p>

      <form @submit.prevent="login" class="w-full max-w-xs space-y-4">
        <div>
          <input 
            v-model="pinInput" 
            type="password" 
            inputmode="numeric" 
            pattern="[0-9]*"
            maxlength="8" 
            placeholder="PIN" 
            class="w-full bg-slate-900 border border-slate-800 text-center text-2xl tracking-widest text-white rounded-xl py-3 focus:outline-none focus:border-emerald-500 transition">
        </div>

        <p v-if="errorMessage" class="text-xs text-red-400 font-medium">{{ errorMessage }}</p>

        <div class="space-y-2">
          <button type="submit" :disabled="loading"
                  class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl text-xs uppercase tracking-wider transition shadow-lg shadow-emerald-900/30 disabled:opacity-50">
            {{ loading ? 'Verificando...' : 'Ingresar' }}
          </button>

          <button 
            v-if="biometriaDisponible && tieneHuellaHabilitada"
            type="button" 
            @click="loginConHuella"
            :disabled="loading"
            class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-semibold py-3 rounded-xl text-xs flex items-center justify-center gap-2 transition">
            <span class="text-base">👆</span> Ingresar con Huella
          </button>
        </div>
      </form>
    </div>

    <!-- APLICACIÓN PRINCIPAL -->
    <template v-else>
      <!-- HEADER -->
      <header class="bg-slate-900/90 backdrop-blur-md sticky top-0 z-20 px-5 py-3 border-b border-slate-800/80 flex justify-between items-center">
        <div class="flex items-center gap-2">
          <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
          <span class="text-xs font-semibold text-slate-300 tracking-wider uppercase">Seba's BankBalance</span>
        </div>
        <button @click="logout" class="text-[10px] text-slate-400 hover:text-red-400 bg-slate-800 px-2 py-1 rounded-md font-mono transition">
          🔒 Salir
        </button>
      </header>

      <!-- CONTENIDO PRINCIPAL -->
      <main class="p-4 flex-1 space-y-4 overflow-y-auto no-scrollbar pb-20">

        <!-- ================= PESTAÑA 1: TARJETA DE CRÉDITO ================= -->
        <div v-if="activeTab === 'tc'" class="space-y-4">
          
          <!-- SALUD FINANCIERA TC: PRESUPUESTO OBJETIVO Y RITMO DE GASTO (BURN RATE) -->
          <div class="bg-gradient-to-br from-slate-900 to-slate-800 p-4 rounded-2xl border border-slate-700/60 shadow-lg space-y-3">
            
            <!-- ENCABEZADO DE PRESUPUESTO -->
            <div class="flex justify-between items-start">
              <div>
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Presupuesto TC {{ mesAnioTextoActual }}</span>
                <span class="text-xs text-slate-500">Meta: <strong class="text-slate-300">{{ formatCLP(saludFinancieraTC.presupuestoTotal) }}</strong></span>
              </div>
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-full border uppercase" :class="saludFinancieraTC.badgeClass">
                {{ saludFinancieraTC.estadoTexto }}
              </span>
            </div>

            <!-- MONTO COMPROMETIDO Y PORCENTAJE -->
            <div class="flex justify-between items-baseline pt-1">
              <span class="text-xl font-bold" :class="saludFinancieraTC.porcentajeGasto > 100 ? 'text-rose-400' : 'text-emerald-400'">
                {{ formatCLP(montoComprometidoActual) }}
              </span>
              <span class="text-xs font-mono font-bold" :class="saludFinancieraTC.porcentajeGasto > 100 ? 'text-rose-400' : 'text-slate-300'">
                {{ saludFinancieraTC.porcentajeGasto }}% de la meta
              </span>
            </div>

            <!-- BARRA DE PROGRESO DE GASTO ACUMULADO -->
            <div class="w-full bg-slate-950 h-2.5 rounded-full overflow-hidden border border-slate-800">
              <div class="h-full rounded-full transition-all duration-500" 
                   :class="saludFinancieraTC.barColor"
                   :style="{ width: Math.min(saludFinancieraTC.porcentajeGasto, 100) + '%' }"></div>
            </div>

            <!-- SECCIÓN BURN RATE: COMPARATIVA TIEMPO VS. GASTO -->
            <div class="pt-2 border-t border-slate-800/80 space-y-1.5 text-xs">
              <div class="flex justify-between items-center text-[10px] font-mono">
                <span class="text-slate-400">⏱️ Tiempo Transcurrido: <strong class="text-slate-200">{{ saludFinancieraTC.porcentajeTiempo }}%</strong> (Día {{ saludFinancieraTC.diaActual }}/{{ saludFinancieraTC.totalDias }})</span>
                <span class="text-slate-400">📊 Consumo: <strong :class="saludFinancieraTC.porcentajeGasto > saludFinancieraTC.porcentajeTiempo ? 'text-amber-400' : 'text-emerald-400'">{{ saludFinancieraTC.porcentajeGasto }}%</strong></span>
              </div>

              <!-- LÍNEA INDICADORA DE RITMO IDEAL VS REAL -->
              <div class="relative w-full bg-slate-950 h-1.5 rounded-full overflow-hidden">
                <div class="bg-sky-500/40 h-full absolute left-0" :style="{ width: saludFinancieraTC.porcentajeTiempo + '%' }"></div>
                <div class="h-full rounded-full transition-all duration-500" 
                     :class="saludFinancieraTC.porcentajeGasto > saludFinancieraTC.porcentajeTiempo ? 'bg-amber-400' : 'bg-emerald-400'"
                     :style="{ width: Math.min(saludFinancieraTC.porcentajeGasto, 100) + '%' }"></div>
              </div>
            </div>

            <!-- DATOS SECUNDARIOS (CUPO DISPONIBLE Y PUNTOS SCOTIA CON EXPIRACIÓN) -->
            <div class="grid grid-cols-2 gap-2 text-xs pt-2 border-t border-slate-800/80">
              <div>
                <span class="text-[9px] block text-slate-500 uppercase font-semibold">Cupo Disponible TC</span>
                <span class="font-bold text-slate-300 font-mono">{{ formatCLP(balancesTC.cupo_disponible) }}</span>
              </div>
              <div class="text-right">
                <span class="text-[9px] block text-slate-500 uppercase font-semibold">PUNTOS SCOTIA</span>
                <span class="font-bold text-amber-400">★ {{ formatNumber(loyaltyInfo.puntos) }}</span>
                <span v-if="loyaltyInfo.fechaVencimiento" class="text-[9px] block text-slate-400 font-mono mt-0.5">
                  Vencen: {{ loyaltyInfo.fechaVencimiento }} ({{ loyaltyInfo.diasFaltantesText }})
                </span>
              </div>
            </div>

          </div>

          <!-- PROYECTOR DE GASTO MES EN CALENDARIO -->
          <div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-800/80 shadow-sm space-y-3">
            <div class="flex justify-between items-center">
              <div>
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-300">Distribución Diaria {{ mesAnioTextoActual }}</h3>
              </div>
              <span class="text-xs font-mono font-bold" :class="saludFinancieraTC.porcentajeGasto > 100 ? 'text-rose-400' : 'text-emerald-400'">
                {{ saludFinancieraTC.porcentajeGasto }}%
              </span>
            </div>

            <div class="grid grid-cols-7 gap-1.5 text-center">
              <span v-for="d in ['L', 'M', 'X', 'J', 'V', 'S', 'D']" :key="d" class="text-[9px] font-bold font-mono text-slate-500 uppercase">{{ d }}</span>
            </div>

            <div class="grid grid-cols-7 gap-1.5">
              <div v-for="offset in proyeccionMes.diasOffset" :key="'offset-' + offset" class="h-7"></div>
              <div 
                v-for="dia in proyeccionMes.dias" 
                :key="dia.numeroDia"
                class="h-7 rounded-md transition-all duration-300 flex flex-col justify-end overflow-hidden relative group border"
                :class="[
                  dia.esHoy ? 'ring-2 ring-sky-400 ring-offset-1 ring-offset-slate-950 z-10' : '',
                  dia.cubiertoCompletamente ? (dia.esFuturo ? 'bg-rose-500 border-rose-400/50 shadow-sm shadow-rose-900/40' : 'bg-emerald-500 border-emerald-400/50 shadow-sm shadow-emerald-900/40') : 
                  dia.esParcial ? (dia.esFuturo ? 'bg-slate-800/80 border-rose-400/80' : 'bg-slate-800/80 border-emerald-400/80') : 
                  'bg-slate-800/40 border-slate-800/80'
                ]">
                <span class="absolute top-0.5 left-1 text-[8px] font-mono leading-none font-bold" :class="dia.cubiertoCompletamente ? 'text-slate-950/80' : 'text-slate-400'">{{ dia.numeroDia }}</span>
                <div v-if="dia.esParcial" :class="dia.esFuturo ? 'bg-rose-500' : 'bg-emerald-500'" class="w-full transition-all duration-300" :style="{ height: dia.porcentajeLlenado + '%' }"></div>
              </div>
            </div>
          </div>

          <!-- MOVIMIENTOS TC CON TOGGLE DE FECHAS -->
          <div class="space-y-2">
            <div class="flex justify-between items-center">
              <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Movimientos TC</h2>
              <div class="flex bg-slate-950 p-0.5 rounded-xl border border-slate-800 text-[10px]">
                <button @click="filtroFechaTC = 'hoy'" :class="filtroFechaTC === 'hoy' ? 'bg-emerald-600 text-white font-bold' : 'text-slate-400'" class="px-2 py-0.5 rounded-lg transition">Hoy</button>
                <button @click="filtroFechaTC = 'mes'" :class="filtroFechaTC === 'mes' ? 'bg-emerald-600 text-white font-bold' : 'text-slate-400'" class="px-2 py-0.5 rounded-lg transition">Mes</button>
                <button @click="filtroFechaTC = 'todos'" :class="filtroFechaTC === 'todos' ? 'bg-emerald-600 text-white font-bold' : 'text-slate-400'" class="px-2 py-0.5 rounded-lg transition">Todos</button>
              </div>
            </div>

            <div class="bg-slate-900/40 rounded-2xl border border-slate-800 divide-y divide-slate-800/60 overflow-hidden">
              <div v-if="movimientosTCFiltrados.length === 0" class="p-4 text-center text-slate-500 text-xs">Sin movimientos en este periodo.</div>
              <div v-for="(item, idx) in movimientosTCFiltrados" :key="idx" class="p-3 flex justify-between items-center text-xs">
                <div>
                  <p class="font-semibold text-slate-200 truncate max-w-[200px]">{{ item.descripcion }}</p>
                  <span class="text-[10px] text-slate-500 font-mono">{{ item.fecha }}</span>
                </div>
                <span class="font-semibold" :class="item.monto > 0 ? 'text-emerald-400' : 'text-slate-200'">{{ formatCLP(item.monto) }}</span>
              </div>
            </div>
          </div>

        </div>

        <!-- ================= PESTAÑA 2: CUENTA CORRIENTE ================= -->
        <div v-if="activeTab === 'cc'" class="space-y-4">
          
          <div class="bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 p-5 rounded-2xl border border-indigo-500/20 shadow-lg space-y-3">
            <span class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest block">Cuenta Corriente</span>
            
            <div class="flex justify-between items-end">
              <div>
                <span class="text-xs text-slate-400 block">Saldo Disponible</span>
                <span class="text-2xl font-bold text-emerald-400">{{ formatCLP(balancesCC.saldo_disponible) }}</span>
              </div>
            </div>

            <div class="pt-2 border-t border-slate-700/50 space-y-1.5 text-xs text-slate-400">
              <div class="flex justify-between">
                <span>Saldo Total</span>
                <span class="font-mono font-semibold text-slate-200">{{ formatCLP(balancesCC.saldo_total) }}</span>
              </div>

              <div class="flex justify-between items-center" :class="balancesCC.retenciones > 0 ? 'text-amber-400' : 'text-slate-500'">
                <span class="flex items-center gap-1">
                  <span>Monto Retenciones</span>
                  <span v-if="balancesCC.retenciones > 0" class="text-[9px] bg-amber-500/10 border border-amber-500/20 px-1 rounded font-mono">Retenido</span>
                </span>
                <span class="font-mono font-semibold">{{ formatCLP(balancesCC.retenciones) }}</span>
              </div>
            </div>
          </div>

          <!-- MOVIMIENTOS CC -->
          <div class="space-y-2">
            <div class="flex justify-between items-center">
              <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Movimientos de Cuenta</h2>
              <div class="flex bg-slate-950 p-0.5 rounded-xl border border-slate-800 text-[10px]">
                <button @click="filtroFechaCC = 'hoy'" :class="filtroFechaCC === 'hoy' ? 'bg-indigo-600 text-white font-bold' : 'text-slate-400'" class="px-2 py-0.5 rounded-lg transition">Hoy</button>
                <button @click="filtroFechaCC = 'mes'" :class="filtroFechaCC === 'mes' ? 'bg-indigo-600 text-white font-bold' : 'text-slate-400'" class="px-2 py-0.5 rounded-lg transition">Mes</button>
                <button @click="filtroFechaCC = 'todos'" :class="filtroFechaCC === 'todos' ? 'bg-indigo-600 text-white font-bold' : 'text-slate-400'" class="px-2 py-0.5 rounded-lg transition">Todos</button>
              </div>
            </div>

            <div class="bg-slate-900/40 rounded-2xl border border-slate-800 divide-y divide-slate-800/60 overflow-hidden">
              <div v-if="movimientosCCFiltrados.length === 0" class="p-4 text-center text-slate-500 text-xs">Sin movimientos en este periodo.</div>
              <div v-for="(item, idx) in movimientosCCFiltrados" :key="idx" class="p-3.5 flex justify-between items-center text-xs hover:bg-slate-900/60">
                <div>
                  <p class="font-semibold text-slate-200 truncate max-w-[200px]">{{ item.descripcion }}</p>
                  <span class="text-[10px] text-slate-500 font-mono">{{ item.fecha }}</span>
                </div>
                <div class="text-right">
                  <span class="font-bold" :class="item.monto > 0 || item.tipo === 'Abono' ? 'text-emerald-400' : 'text-slate-200'">
                    {{ item.monto > 0 ? '+' : '' }}{{ formatCLP(item.monto) }}
                  </span>
                  <span class="text-[9px] block uppercase font-bold text-slate-500">{{ item.tipo }}</span>
                </div>
              </div>
            </div>
          </div>

        </div>

        <!-- ================= PESTAÑA 3: INVERSIONES ================= -->
        <div v-if="activeTab === 'inversiones'" class="space-y-4">
          <div class="bg-gradient-to-br from-slate-900 via-slate-900 to-emerald-950 p-5 rounded-2xl border border-emerald-500/20 shadow-lg space-y-2">
            <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest block">Portafolio Total</span>
            <span class="text-2xl font-bold text-white block">{{ formatCLP(inversionesData.total) }}</span>
            <span class="text-xs text-slate-400 block">{{ inversionesData.por_fondo?.length || 0 }} fondos activos</span>
          </div>

          <div class="space-y-2">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Distribución por Fondo</h2>
            <div class="space-y-2">
              <div v-for="(fondo, idx) in inversionesData.por_fondo" :key="idx" class="bg-slate-900/60 p-4 rounded-2xl border border-slate-800 space-y-2">
                <div class="flex justify-between items-start">
                  <div>
                    <h3 class="text-xs font-semibold text-slate-200">{{ fondo.fund }}</h3>
                    <span class="text-[10px] text-emerald-400 font-mono font-bold">{{ fondo.percentage }}% del portafolio</span>
                  </div>
                  <span class="text-sm font-bold text-white">{{ formatCLP(fondo.balance) }}</span>
                </div>
                <div class="w-full bg-slate-950 h-1.5 rounded-full overflow-hidden">
                  <div class="bg-emerald-500 h-full rounded-full" :style="{ width: fondo.percentage + '%' }"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ================= PESTAÑA 4: CONSOLIDADO ================= -->
        <div v-if="activeTab === 'consolidado'" class="space-y-4">
          <div class="space-y-2">
            <input v-model="busqueda" type="text" placeholder="Buscar por descripción..." 
                   class="w-full bg-slate-900 border border-slate-800 text-slate-200 placeholder-slate-500 text-xs rounded-xl px-3 py-2.5 focus:outline-none">

            <div class="flex justify-between items-center pt-1">
              <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Historial Global</h2>
              <div class="flex bg-slate-950 p-0.5 rounded-xl border border-slate-800 text-[10px]">
                <button @click="filtroFechaGlobal = 'hoy'" :class="filtroFechaGlobal === 'hoy' ? 'bg-sky-600 text-white font-bold' : 'text-slate-400'" class="px-2 py-0.5 rounded-lg transition">Hoy</button>
                <button @click="filtroFechaGlobal = 'mes'" :class="filtroFechaGlobal === 'mes' ? 'bg-sky-600 text-white font-bold' : 'text-slate-400'" class="px-2 py-0.5 rounded-lg transition">Mes</button>
                <button @click="filtroFechaGlobal = 'todos'" :class="filtroFechaGlobal === 'todos' ? 'bg-sky-600 text-white font-bold' : 'text-slate-400'" class="px-2 py-0.5 rounded-lg transition">Todos</button>
              </div>
            </div>
          </div>

          <div class="bg-slate-900/40 rounded-2xl border border-slate-800 divide-y divide-slate-800/60 overflow-hidden">
            <div v-if="todosLosMovimientosFiltrados.length === 0" class="p-4 text-center text-slate-500 text-xs">No hay movimientos en este periodo.</div>
            <div v-for="(item, idx) in todosLosMovimientosFiltrados" :key="idx" class="p-3.5 flex justify-between items-center text-xs">
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="px-1.5 py-0.5 rounded text-[8px] font-bold font-mono uppercase" 
                        :class="item.origen === 'TC' ? 'bg-rose-500/10 text-rose-400 border border-rose-500/20' : 'bg-indigo-500/10 text-indigo-400 border border-indigo-500/20'">
                    {{ item.origen }}
                  </span>
                  <p class="font-semibold text-slate-200 truncate max-w-[160px]">{{ item.descripcion }}</p>
                </div>
                <span class="text-[10px] text-slate-500 font-mono block mt-0.5">{{ item.fecha }}</span>
              </div>
              <span class="font-bold" :class="item.monto > 0 ? 'text-emerald-400' : 'text-slate-200'">{{ formatCLP(item.monto) }}</span>
            </div>
          </div>
        </div>

        <!-- METADATA EN FOOTER -->
        <div v-if="data.metadata?.timestamp" class="text-center pt-2">
          <span class="text-[9px] text-slate-600 font-mono">Última Sincronización: {{ formatTimestamp(data.metadata.timestamp) }}</span>
        </div>

      </main>

      <!-- BARRA DE NAVEGACIÓN INFERIOR (TABS) -->
      <nav class="bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 fixed bottom-0 left-0 right-0 max-w-md mx-auto z-30 flex justify-around items-center px-2 py-2 text-[10px]">
        <button @click="activeTab = 'tc'" :class="activeTab === 'tc' ? 'text-emerald-400 font-bold' : 'text-slate-500'" class="flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition">
          <span class="text-base">💳</span>
          <span>Tarjeta</span>
        </button>

        <button @click="activeTab = 'cc'" :class="activeTab === 'cc' ? 'text-indigo-400 font-bold' : 'text-slate-500'" class="flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition">
          <span class="text-base">🏦</span>
          <span>Cuenta</span>
        </button>

        <button @click="activeTab = 'inversiones'" :class="activeTab === 'inversiones' ? 'text-emerald-400 font-bold' : 'text-slate-500'" class="flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition">
          <span class="text-base">📈</span>
          <span>Inversión</span>
        </button>

        <button @click="activeTab = 'consolidado'" :class="activeTab === 'consolidado' ? 'text-sky-400 font-bold' : 'text-slate-500'" class="flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition">
          <span class="text-base">📊</span>
          <span>Global</span>
        </button>
      </nav>

    </template>

  </div>

  <script>
    const { createApp, ref, computed, watch, onMounted } = Vue;

    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwDbk6232lk5wgfhORW7hnjndydSOaO3qecF5byZW-SFnHUXCrB7QC7tXUX7B5VS8teYA/exec';

    const GASTO_CONFIG = {
      SEMANA: 50000,
      FIN_SEMANA: 100000
    };

    const bufferToBase64 = (buffer) => btoa(String.fromCharCode(...new Uint8Array(buffer)));
    const base64ToBuffer = (base64) => Uint8Array.from(atob(base64), c => c.charCodeAt(0));

    createApp({
      setup() {
        const authenticated = ref(false);
        const pinInput = ref('');
        const activePin = ref('');
        const errorMessage = ref('');
        const loading = ref(false);
        const data = ref({});
        const busqueda = ref('');
        const tieneHuellaHabilitada = ref(false);
        const biometriaDisponible = ref(false);
        
        const activeTab = ref('tc');

        const filtroFechaTC = ref('todos');
        const filtroFechaCC = ref('todos');
        const filtroFechaGlobal = ref('todos');

        const getRpId = () => window.location.hostname;

        const soportaBiometria = async () => {
          try {
            return !!(window.PublicKeyCredential && 
              await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());
          } catch (e) {
            return false;
          }
        };

        const registrarHuella = async (pin) => {
          try {
            const challenge = new Uint8Array(32);
            window.crypto.getRandomValues(challenge);
            const currentDomain = getRpId();

            const publicKey = {
              challenge: challenge,
              rp: { name: "BankBalance", id: currentDomain.length > 0 ? currentDomain : undefined },
              user: { id: Uint8Array.from("user_bank_balance_id", c => c.charCodeAt(0)), name: "seba@bankbalance", displayName: "Seba BankBalance" },
              pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
              authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "preferred" },
              timeout: 60000
            };

            const credential = await navigator.credentials.create({ publicKey });
            if (credential) {
              localStorage.setItem('bankbalance_bio_pin', btoa(pin));
              localStorage.setItem('bankbalance_bio_cred_id', bufferToBase64(credential.rawId));
              localStorage.setItem('bankbalance_bio_enabled', 'true');
              vibrate(50);
              return true;
            }
          } catch (e) {
            console.error("Error al registrar huella:", e);
            return false;
          }
        };

        const autenticarConHuella = async () => {
          const storedEncryptedPin = localStorage.getItem('bankbalance_bio_pin');
          const storedCredId = localStorage.getItem('bankbalance_bio_cred_id');
          if (!storedEncryptedPin || !storedCredId) return null;

          if (window.PublicKeyCredential) {
            try {
              const challenge = new Uint8Array(32);
              window.crypto.getRandomValues(challenge);
              const publicKeyOptions = {
                challenge: challenge,
                rpId: getRpId() || undefined,
                userVerification: "preferred",
                timeout: 60000,
                allowCredentials: [{ id: base64ToBuffer(storedCredId), type: 'public-key' }]
              };
              const credential = await navigator.credentials.get({ publicKey: publicKeyOptions });
              if (credential) return atob(storedEncryptedPin);
            } catch (e) {
              return null;
            }
          }
          return atob(storedEncryptedPin);
        };

        onMounted(async () => {
          if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
          const localCachedData = localStorage.getItem('bankbalance_last_data');
          if (localCachedData) data.value = JSON.parse(localCachedData);

          const storedPin = sessionStorage.getItem('app_pin');
          if (storedPin) {
            activePin.value = storedPin;
            await fetchData(storedPin);
          }

          biometriaDisponible.value = await soportaBiometria();
          tieneHuellaHabilitada.value = localStorage.getItem('bankbalance_bio_enabled') === 'true';
        });

        const fetchData = async (pin) => {
          loading.value = true;
          errorMessage.value = '';
          try {
            const response = await fetch(GOOGLE_SCRIPT_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ pin: pin, exec: 'READ' })
            });
            const result = await response.json();
            if (result.success) {
              authenticated.value = true;
              localStorage.setItem('bankbalance_last_data', JSON.stringify(result.data));
              data.value = result.data || {};
              sessionStorage.setItem('app_pin', pin);
            } else {
              errorMessage.value = result.error || 'Acceso no autorizado.';
              logout();
            }
          } catch (e) {
            errorMessage.value = 'Error al consultar los datos.';
            logout();
          } finally {
            loading.value = false;
          }
        };

        const vibrate = (ms = 15) => { if ('vibrate' in navigator) navigator.vibrate(ms); };

        const login = async () => {
          if (!pinInput.value) return;
          activePin.value = pinInput.value;
          await fetchData(pinInput.value);
          if (authenticated.value && biometriaDisponible.value && !tieneHuellaHabilitada.value) {
            if (confirm("¿Deseas activar el ingreso rápido con Huella Dactilar?")) {
              const ok = await registrarHuella(pinInput.value);
              if (ok) tieneHuellaHabilitada.value = true;
            }
          }
          pinInput.value = '';
        };

        const logout = () => {
          sessionStorage.removeItem('app_pin');
          authenticated.value = false;
          activePin.value = '';
          data.value = {};
        };

        const loginConHuella = async () => {
          vibrate(20);
          const pinRecuperado = await autenticarConHuella();
          if (pinRecuperado) {
            activePin.value = pinRecuperado;
            await fetchData(pinRecuperado);
          } else {
            errorMessage.value = 'Huella no reconocida o cancelado.';
          }
        };

        const formatCLP = (val) => val !== undefined && val !== null ? new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', maximumFractionDigits: 0 }).format(val) : '$0';
        const formatNumber = (val) => val ? new Intl.NumberFormat('es-CL').format(val) : '0';
        const formatTimestamp = (isoStr) => isoStr ? new Date(isoStr).toLocaleString('es-CL', { dateStyle: 'short', timeStyle: 'short' }) : '';

        const aplicarFiltroFecha = (lista, modo) => {
          if (!lista || lista.length === 0) return [];
          if (modo === 'todos') return lista;

          const hoyISO = new Date().toISOString().substring(0, 10);
          const mesISO = hoyISO.substring(0, 7);

          if (modo === 'hoy') return lista.filter(m => m.fecha === hoyISO);
          if (modo === 'mes') return lista.filter(m => m.fecha && m.fecha.startsWith(mesISO));
          return lista;
        };

        // FUENTES DE DATOS COMPUTADAS
        const balancesTC = computed(() => data.value.tarjeta_de_credito?.balances || {});
        const movimientosTC = computed(() => data.value.tarjeta_de_credito?.movimientos || []);

        // PUNTOS Y FECHA DE VENCIMIENTO
        const loyaltyInfo = computed(() => {
          const rawLoyalty = data.value.loyalty || data.value.tarjeta_de_credito?.loyalty || {};
          const puntos = rawLoyalty.puntos_totales || rawLoyalty.puntos || 0;
          const fechaVenc = rawLoyalty.fecha_vencimiento || rawLoyalty.vencimiento; 

          let diasFaltantesText = '';
          let fechaFormateada = '';

          if (fechaVenc) {
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);
            const venc = new Date(fechaVenc);
            
            const diffTime = venc.getTime() - hoy.getTime();
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            fechaFormateada = venc.toLocaleDateString('es-CL', { day: '2-digit', month: '2-digit', year: 'numeric' });

            if (diffDays < 0) {
              diasFaltantesText = 'Vencidos';
            } else if (diffDays === 0) {
              diasFaltantesText = 'Vencen hoy';
            } else {
              diasFaltantesText = `faltan ${diffDays} días`;
            }
          }

          return {
            puntos,
            fechaVencimiento: fechaFormateada,
            diasFaltantesText
          };
        });

        const movimientosTCFiltrados = computed(() => aplicarFiltroFecha(movimientosTC.value, filtroFechaTC.value));

        // CC Y OTROS
        const balancesCC = computed(() => {
          const rawCC = data.value.cuenta_corriente?.balances || {};
          const saldoTotal = rawCC.saldo_total || 0;
          const retenciones = rawCC.retenciones || 0;
          return {
            saldo_total: saldoTotal,
            retenciones: retenciones,
            saldo_disponible: saldoTotal - retenciones
          };
        });
        
        const movimientosCC = computed(() => data.value.cuenta_corriente?.movimientos || []);
        const movimientosCCFiltrados = computed(() => aplicarFiltroFecha(movimientosCC.value, filtroFechaCC.value));
        const inversionesData = computed(() => data.value.inversiones || { total: 0, por_fondo: [] });

        const todosLosMovimientosFiltrados = computed(() => {
          const tc = movimientosTC.value.map(m => ({ ...m, origen: 'TC' }));
          const cc = movimientosCC.value.map(m => ({ ...m, origen: 'CC' }));
          let unificados = [...tc, ...cc].sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

          unificados = aplicarFiltroFecha(unificados, filtroFechaGlobal.value);

          if (busqueda.value.trim() !== '') {
            const q = busqueda.value.toLowerCase();
            unificados = unificados.filter(m => m.descripcion.toLowerCase().includes(q));
          }
          return unificados;
        });

        const montoComprometidoActual = computed(() => balancesTC.value.monto_a_pagar ? Math.abs(balancesTC.value.monto_a_pagar) : 0);
        const mesAnioTextoActual = computed(() => new Date().toLocaleString('es-CL', { month: 'long', year: 'numeric' }));

        // UNIFICACIÓN Y CÁLCULO DE ESTRUCTURA MENSUAL Y CALENDARIO
        const proyeccionMes = computed(() => {
          const hoy = new Date();
          const year = hoy.getFullYear();
          const month = hoy.getMonth() + 1;
          const diaHoyNum = hoy.getDate();

          const totalDiasMes = new Date(year, month, 0).getDate();
          const diaSemanaPrimerDia = new Date(year, month - 1, 1).getDay(); 
          const diasOffset = (diaSemanaPrimerDia === 0) ? 6 : diaSemanaPrimerDia - 1;

          let presupuestoTotal = 0;
          const estructuraDias = [];

          for (let d = 1; d <= totalDiasMes; d++) {
            const esFinDeSemana = ([0, 6].includes(new Date(year, month - 1, d).getDay()));
            const cupoDia = esFinDeSemana ? GASTO_CONFIG.FIN_SEMANA : GASTO_CONFIG.SEMANA;
            presupuestoTotal += cupoDia;

            estructuraDias.push({
              numeroDia: d,
              cupoDia,
              esHoy: (d === diaHoyNum),
              esFuturo: (d > diaHoyNum),
              cubiertoCompletamente: false,
              esParcial: false,
              porcentajeLlenado: 0
            });
          }

          let remanenteGasto = montoComprometidoActual.value;
          for (let dia of estructuraDias) {
            if (remanenteGasto >= dia.cupoDia) {
              dia.cubiertoCompletamente = true;
              remanenteGasto -= dia.cupoDia;
            } else if (remanenteGasto > 0) {
              dia.esParcial = true;
              dia.porcentajeLlenado = Math.round((remanenteGasto / dia.cupoDia) * 100);
              remanenteGasto = 0;
            } else {
              break;
            }
          }

          return {
            dias: estructuraDias,
            diasOffset,
            presupuestoTotal,
            totalDiasMes,
            diaHoyNum
          };
        });

        // INDICADOR DE SALUD FINANCIERA (USA PROYECCIONMES REUTILIZANDO CÁLCULOS)
        const saludFinancieraTC = computed(() => {
          const { presupuestoTotal, totalDiasMes, diaHoyNum } = proyeccionMes.value;
          const gastado = montoComprometidoActual.value;

          const porcentajeGasto = presupuestoTotal > 0 ? Math.round((gastado / presupuestoTotal) * 100) : 0;
          const porcentajeTiempo = Math.round((diaHoyNum / totalDiasMes) * 100);

          let estadoTexto = 'Ritmo Sostenible';
          let badgeClass = 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400';
          let barColor = 'bg-emerald-500';

          if (porcentajeGasto > 100) {
            estadoTexto = 'Presupuesto Excedido';
            badgeClass = 'bg-rose-500/10 border-rose-500/30 text-rose-400 animate-pulse';
            barColor = 'bg-rose-500';
          } else if (porcentajeGasto > porcentajeTiempo + 15) {
            estadoTexto = 'Gastando Rápido';
            badgeClass = 'bg-amber-500/10 border-amber-500/30 text-amber-400';
            barColor = 'bg-amber-500';
          } else if (porcentajeGasto >= 85) {
            estadoTexto = 'Límite Cercano';
            badgeClass = 'bg-amber-500/10 border-amber-500/30 text-amber-400';
            barColor = 'bg-amber-500';
          }

          return {
            presupuestoTotal,
            porcentajeGasto,
            porcentajeTiempo,
            diaActual: diaHoyNum,
            totalDias: totalDiasMes,
            estadoTexto,
            badgeClass,
            barColor
          };
        });

        watch([activeTab, filtroFechaTC, filtroFechaCC, filtroFechaGlobal], () => {
          vibrate();
        });

        return {
          authenticated, pinInput, errorMessage, loading, data, busqueda,
          mesAnioTextoActual, GASTO_CONFIG, montoComprometidoActual, proyeccionMes, saludFinancieraTC,
          tieneHuellaHabilitada, biometriaDisponible, loginConHuella, activeTab,
          filtroFechaTC, filtroFechaCC, filtroFechaGlobal,
          balancesTC, movimientosTCFiltrados, loyaltyInfo, 
          balancesCC, movimientosCCFiltrados, inversionesData, todosLosMovimientosFiltrados,
          vibrate, login, logout, formatCLP, formatNumber, formatTimestamp
        };
      }
    }).mount('#app');
  </script>
</body>
