<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sendero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/products.js"></script>
<script src="js/params.js"></script>
<script src="at.js"></script>
</head>
<body data-page="product">
<div id="promo-bar" class="promo">Envío gratis en compras desde $80</div>
<header class="top">
  <a class="logo" href="index.html">Sendero</a>
  <nav aria-label="Categorías">
    <a href="category.html?cat=running">Running</a>
    <a href="category.html?cat=trail">Trail</a>
    <a href="category.html?cat=casual">Casual</a>
  </nav>
</header>
<main>
<p class="crumb"><a href="index.html">Inicio</a></p>
<section class="pdp">
  <img id="p-img" src="img/sd-101.svg" alt="">
  <div>
    <div id="p-cat" class="meta"></div>
    <h1 id="p-name"></h1>
    <div id="p-price" class="price"></div>
    <p id="p-msg"></p>
    <a id="buy-btn" class="btn" href="confirmation.html">Comprar ahora</a>
  </div>
</section>
<section class="block" aria-labelledby="recs-p-title">
  <h2 id="recs-p-title">Completa tu equipo</h2>
  <div id="recs-product" class="recs-slot"></div>
</section>
</main>
<footer>
  <button id="dbg-toggle" aria-expanded="false" aria-controls="dbg">Ver parámetros enviados a Target</button>
  <pre id="dbg"></pre>
</footer>
<script src="js/app.js"></script>
</body>
</html>
